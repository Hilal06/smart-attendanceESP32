services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: smart-attendance-app
    restart: unless-stopped
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_KEY=${APP_KEY}
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - ./storage:/var/www/storage
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - smart-attendance-network

  webserver:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: smart-attendance-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    volumes:
      - ./storage:/var/www/storage
    networks:
      - smart-attendance-network

  db:
    image: mariadb:10.6
    container_name: smart-attendance-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - smart-attendance-network

  face-recognition:
    build:
      context: ./python_service
      dockerfile: Dockerfile
    container_name: smart-attendance-recognition
    restart: unless-stopped
    environment:
      - API_KEY=${API_KEY}
      - LARAVEL_API_URL=http://webserver/api/attendance
    ports:
      - "5000:5000"
    volumes:
      - ./python_service/known_faces:/app/known_faces
      - ./python_service/uploads:/app/uploads
      - ./python_service/rejected_faces:/app/rejected_faces
    networks:
      - smart-attendance-network

networks:
  smart-attendance-network:
    driver: bridge

volumes:
  dbdata:
